# TASK-001 §1 requires the implementation to have no external dependencies.
# This project therefore declares no third-party packages and no build backend:
# it is run directly from the source tree and tested with the standard library's
# unittest module. There is deliberately nothing to install.

[project]
name = "radhanite"
version = "0.1.0"
description = "An economic control layer for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
