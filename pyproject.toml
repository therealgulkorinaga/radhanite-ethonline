[project]
name = "radhanite"
version = "0.1.0"
description = "An economic control layer for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radhanite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
